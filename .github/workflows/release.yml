name: release

# release-please keeps a release PR open that bumps version.txt and
# CHANGELOG.md from the Conventional Commits on main. Merging that PR tags
# vX.Y.Z, creates the GitHub release, and the publish job attaches the build.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
      - name: Configure
        run: cmake -S . -B build -A x64 -DMONITONE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Package and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          $name = "Monitone-$($env:TAG.TrimStart('v'))-x64"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/bin/Release/Monitone.exe, build/bin/Release/MonitoneSettings.dll, README.md, LICENSE, CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          gh release upload $env:TAG "$name.zip" "$name.zip.sha256" --clobber
