name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe data for the version resource
      - name: Configure
        run: cmake -S . -B build -A x64 -DMONITONE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: Monitone-x64
          path: |
            build/bin/Release/Monitone.exe
            build/bin/Release/MonitoneSettings.dll

  mingw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMONITONE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
      - name: Build
        run: cmake --build build

  ui:
    # Renders every settings page with the mock bridge; fails on script errors
    # or Content Security Policy violations and keeps the screenshots.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Render pages
        run: node tools/ui-preview/preview.mjs ui-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview
          path: ui-preview
